# The upstream code this repository builds, pinned by commit. Read by
# scripts/fetch-upstream.sh, which checks every value below.
#
# Dashboard: the merge of two upstream commits, checked against the tree it
# must produce. A single commit replaces them once upstream merges main into
# Togo (DASHBOARD_COMMITS then holds one SHA and DASHBOARD_TREE is its tree).
DASHBOARD_URL=https://github.com/dime-worldbank/rpf-country-dash.git
DASHBOARD_REFS="refs/heads/main refs/heads/Togo"
DASHBOARD_COMMITS="4a2665eedcee3600ef1fc5a83f9ce60d16dba79c 566112ebf7aa1f7d07fa4efbd010278421d33583"
DASHBOARD_TREE=493dca98bef669079c7abf291ec1296d9b095e72

# Indicator ETL: only the folders of the notebooks local_runner.notebooks() lists
# (the repository's top-level files are always checked out).
INDICATORS_URL=https://github.com/dime-worldbank/mega-indicators.git
INDICATORS_REF=refs/heads/main
INDICATORS_COMMIT=f3ba605a9ec4f5451b0a6fbc3e632e7150fd0ab6
INDICATORS_PATHS="education geo health human_development pefa population poverty public_finance"

# Togo BOOST ETL.
BOOST_URL=https://github.com/dime-worldbank/mega-boost.git
BOOST_REF=refs/heads/main
BOOST_COMMIT=f6db6954b114255db9e1d7e5fc96f1f0ab976ccc
BOOST_PATHS="Togo"
