# The upstream code this repository builds, pinned by commit. Read by
# scripts/fetch-upstream.sh, which checks every value below.
#
# Dashboard: one commit, or the merge of two, checked against the tree it must
# produce (DASHBOARD_TREE). The commit below is on the anthbel fork: upstream Togo
# (a85edf6, which includes upstream main) merged with togo/execution-page, the
# budget-execution page and its Excel exports (own tables, SIGFIP report tables,
# compte administratif), then the chart fixes (number formats and units, axis
# and label placement, wording, outcome year, trend sentences) and the fiscal balance
# on the DGBF's official figures without the composite view, not merged upstream yet.
DASHBOARD_URL=https://github.com/anthbel/rpf-country-dash.git
DASHBOARD_REFS="refs/heads/fix/fiscal-balance-official-file"
DASHBOARD_COMMITS="52469f96a1afabbca2260399a8d11179d86f011f"
DASHBOARD_TREE=46866ed5749970c43ce8c6ea997d0b5be1285150

# Indicator ETL: only the folders of the notebooks local_runner.notebooks() lists
# (the repository's top-level files are always checked out).
INDICATORS_URL=https://github.com/dime-worldbank/mega-indicators.git
INDICATORS_REF=refs/heads/main
INDICATORS_COMMIT=f3ba605a9ec4f5451b0a6fbc3e632e7150fd0ab6
INDICATORS_PATHS="education geo health human_development pefa population poverty public_finance"

