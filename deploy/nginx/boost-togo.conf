# Proxy inverse HTTPS devant le tableau de bord (Nginx installé sur le serveur).
# Remplacer NOM_DE_DOMAINE par le nom attribué par l'ATD, et les chemins des
# certificats par ceux fournis. Copier dans /etc/nginx/conf.d/ puis
# « nginx -t && systemctl reload nginx ».

server {
    listen 80;
    server_name NOM_DE_DOMAINE;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name NOM_DE_DOMAINE;

    ssl_certificate     /etc/ssl/boost-togo/fullchain.pem;
    ssl_certificate_key /etc/ssl/boost-togo/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The dashboard sends its pages, scripts and chart data uncompressed.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Le pipeline vide le cache par le réseau Docker interne ; l'adresse
    # n'a pas à être joignable depuis l'extérieur.
    location /api/cache/clear {
        return 403;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
